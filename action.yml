name: Events Repository
description: Publish Open Evnt events to GitHub Pages
author: Open Evnt Contributors

branding:
  icon: calendar
  color: yellow

inputs:
  node-version:
    description: The Node.js version to use
    required: false
    default: "24"
  events-path:
    description: The root folder where events are stored
    required: true
    default: "./events"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - shell: bash
      run: mkdir /tmp/openevnt-output
    - shell: bash
      run: npx @evnt/dev@latest build ${{ inputs.events-path }} --out /tmp/openevnt-output
    - uses: actions/upload-pages-artifact@v3
      with:
        path: /tmp/openevnt-output
